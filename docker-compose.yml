services:
  # Demo Merchant Harness Container (5 behavioral variants)
  harness:
    build:
      context: ./harness
      dockerfile: Dockerfile
    container_name: checkout-radar-harness
    ports:
      - "127.0.0.1:${HARNESS_PORT:-8001}:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8001/variant/clean >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # Backend REST API + SSE Progress Stream + Dashboard Static UI
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: checkout-radar-api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend
      - ./backend/app:/app/app
      - ./data/ccpa_definitions.json:/data/ccpa_definitions.json:ro
      - ./evaluation:/evaluation:ro
    env_file:
      - path: .env
        required: false
    environment:
      - SQLITE_DB_PATH=/app/data/checkout_radar.db
      - EVIDENCE_DIR=/app/data/evidence
      - FRONTEND_DIR=/app/frontend
      - MOCK_TINYFISH=${MOCK_TINYFISH:-true}
    depends_on:
      harness:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Durable Job Worker Daemon with Lease Recovery
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: checkout-radar-worker
    command: ["python3", "-m", "app.worker.daemon"]
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app
      - ./data/ccpa_definitions.json:/data/ccpa_definitions.json:ro
      - ./evaluation:/evaluation:ro
    env_file:
      - path: .env
        required: false
    environment:
      - SQLITE_DB_PATH=/app/data/checkout_radar.db
      - EVIDENCE_DIR=/app/data/evidence
      - WORKER_ID=compose_worker_1
      - MOCK_TINYFISH=${MOCK_TINYFISH:-true}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
